# Placeholder app name. Troy can rename this before `fly apps create`.
app = "appsolutely-sino"
primary_region = "sin"

kill_timeout = "30s"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Stay up during a demo. Auto-stop would drop WebSockets.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
